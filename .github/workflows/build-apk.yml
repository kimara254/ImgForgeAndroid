name: Build ImgForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ImgForge source
        run: |
          mkdir -p extracted
          unzip -q ImgForgeAndroid_source.zip -d extracted

      - name: Find project root and build debug APK
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "sdk.dir=/usr/local/lib/android/sdk" > "$PROJECT_DIR/local.properties"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImgForge-debug-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
