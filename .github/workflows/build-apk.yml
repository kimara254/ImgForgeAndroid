name: Build ImgForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ImgForge source
        run: |
          mkdir -p extracted
          unzip -q ImgForgeAndroid_source.zip -d extracted

      - name: Patch Java Compatibility & Build APK
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          echo "Found Gradle project at: $PROJECT_DIR"
          
          # Use Python to safely and thoroughly update all Java 1.8 / compatibility targets to 17
          python3 - <<EOF
          import glob, re
          for filepath in glob.glob('$PROJECT_DIR/**/build.gradle*', recursive=True):
              with open(filepath, 'r') as f:
                  text = f.read()
              text = text.replace('VERSION_1_8', 'VERSION_17')
              text = re.sub(r'(sourceCompatibility|targetCompatibility)\s*=?\s*([\'"])1\.8\2', r'\1 = \217\2', text)
              text = re.sub(r'(sourceCompatibility|targetCompatibility)\s*=?\s*1\.8', r'\1 = 17', text)
              text = re.sub(r'jvmTarget\s*=?\s*([\'"])1\.8\1', r'jvmTarget = \117\1', text)
              with open(filepath, 'w') as f:
                  f.write(text)
          print("Successfully patched build files to Java 17 compatibility.")
          EOF

          echo "sdk.dir=/usr/local/lib/android/sdk" > "$PROJECT_DIR/local.properties"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImgForge-debug-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
