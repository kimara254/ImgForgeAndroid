
name: Build ImgForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ImgForge source
        run: |
          set -eu
          mkdir -p extracted
          unzip -q ImgForgeAndroid_source.zip -d extracted

      - name: Fix JVM targets and build APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found inside ImgForgeAndroid_source.zip"
            echo "ZIP contents:"
            unzip -l ImgForgeAndroid_source.zip
            exit 1
          fi

          echo "Gradle project: $PROJECT_DIR"

          export PROJECT_DIR

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          files = list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts"))

          if not files:
              raise SystemExit("ERROR: No Gradle build files found.")

          for path in files:
              text = path.read_text()
              original = text

              # Normalize Java 8 compatibility constants.
              text = text.replace("VERSION_1_8", "VERSION_17")

              # Handle Java compatibility declarations in Groovy and Kotlin DSL.
              text = re.sub(
                  r'(?m)^(\s*(?:sourceCompatibility|targetCompatibility)\s*=\s*)JavaVersion\.VERSION_1_8\b',
                  r'\1JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'(?m)^(\s*(?:sourceCompatibility|targetCompatibility)\s*=\s*)(["\'])1\.8\2',
                  lambda m: m.group(1) + m.group(2) + "17" + m.group(2),
                  text
              )

              text = re.sub(
                  r'(?m)^(\s*(?:sourceCompatibility|targetCompatibility)\s*=\s*)1\.8\b',
                  r'\g<1>17',
                  text
              )

              # Handle Kotlin jvmTarget declarations using either quote style.
              text = re.sub(
                  r'(?m)^(\s*jvmTarget\s*=\s*)(["\'])1\.8\2',
                  lambda m: m.group(1) + m.group(2) + "17" + m.group(2),
                  text
              )

              # Also handle Kotlin DSL's JavaVersion target declarations.
              text = re.sub(
                  r'(?m)^(\s*(?:sourceCompatibility|targetCompatibility)\s*=\s*)JavaVersion\.VERSION_1_8\b',
                  r'\1JavaVersion.VERSION_17',
                  text
              )

              # Add a Java 17 target to Android modules when compileOptions are missing.
              if re.search(r'\bid\s*\(?\s*["\']com\.android\.(?:application|library)["\']', text):
                  if "compileOptions" not in text:
                      if path.name == "build.gradle.kts":
                          block = """
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
                      else:
                          block = """
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """
                      text += "\n" + block

              if text != original:
                  path.write_text(text)
                  print(f"Updated {path.relative_to(root)}")
              else:
                  print(f"Checked {path.relative_to(root)}")

          print("Gradle compatibility patch completed.")
          PY

          # Ensure Gradle uses the Android SDK installed on the runner.
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImgForge-debug-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
