
name: Build ImgForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ImgForge source
        shell: bash
        run: |
          set -euo pipefail

          test -f ImgForgeAndroid_source.zip || {
            echo "ERROR: ImgForgeAndroid_source.zip is missing."
            exit 1
          }

          mkdir -p extracted
          unzip -q ImgForgeAndroid_source.zip -d extracted

      - name: Configure Java and Kotlin JVM 17
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          APP_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_FILE" ]; then
            echo "ERROR: App Gradle file not found: $APP_FILE"
            exit 1
          fi

          export APP_FILE
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["APP_FILE"])
          text = path.read_text()

          if "compileSdk = 35" not in text:
              raise SystemExit(
                  "ERROR: Expected compileSdk = 35 was not found. "
                  "Refusing to guess where to insert settings."
              )

          if "compileOptions" not in text:
              marker = "    compileSdk = 35\n"
              addition = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
              text = text.replace(marker, marker + addition, 1)

          if "kotlinOptions" not in text:
              marker = "    compileSdk = 35\n"
              addition = """
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              text = text.replace(marker, marker + addition, 1)

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              raise SystemExit("ERROR: Java 17 configuration was not applied.")

          if "targetCompatibility = JavaVersion.VERSION_17" not in text:
              raise SystemExit("ERROR: Java target 17 was not applied.")

          if 'jvmTarget = "17"' not in text:
              raise SystemExit("ERROR: Kotlin JVM target 17 was not applied.")

          path.write_text(text)
          print("Verified Java source compatibility: 17")
          print("Verified Java target compatibility: 17")
          print("Verified Kotlin JVM target: 17")
          print("Root Gradle file left unchanged.")
          PY

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Project: $PROJECT_DIR"
          echo "Java version:"
          java -version

          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Build finished without producing the expected APK."
            find . -path '*/build/outputs/apk/*/*.apk' -print
            exit 1
          fi

          echo "APK successfully created: $APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ImgForge-debug-apk
          path: extracted/ImgForgeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
